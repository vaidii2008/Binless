
name: CI

on: push

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
